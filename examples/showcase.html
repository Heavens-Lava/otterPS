<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otter Web Showcase</title>
  <style>
    :root {
      --otter-bg: #0f172a;
      --otter-card-bg: #1e293b;
      --otter-text: #f8fafc;
      --otter-text-muted: #94a3b8;
      --otter-primary: #2563eb;
      --otter-primary-hover: #1d4ed8;
      --otter-input-bg: #334155;
      --otter-border: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--otter-bg);
      color: var(--otter-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .otter-window, .otter-page {
      background-color: var(--otter-card-bg);
      border: 1px solid var(--otter-border);
      width: 100%;
      max-width: 520px;
    }
    .otter-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .otter-button {
      background-color: var(--otter-primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.08s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .otter-button:hover { background-color: var(--otter-primary-hover); }
    .otter-button:active { transform: scale(0.98); }
    .otter-text-box {
      background-color: var(--otter-input-bg);
      color: var(--otter-text);
      border: 1px solid var(--otter-border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease;
      width: 100%;
    }
    .otter-text-box:focus {
      border-color: var(--otter-primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }
    .otter-text {
      font-size: 0.95rem;
      min-height: 1.2em;
    }
    #otter-live-output {
      margin-top: 16px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      display: none;
    }
  </style>
</head>
<body>
    <main id="app" class="otter-page" style="width: 560px; background-color: #0f172a;" style="display: flex; flex-direction: column; gap: 14px; padding: 24px; width: 560px; background-color: #0f172a;">
      <header class="otter-page-header"><h1 class="otter-title">Otter Web Showcase</h1></header>
      <div class="otter-page-content" style="display: flex; flex-direction: column; gap: 14px;">
      <div id="headerText" class="otter-text" style="color: #38bdf8;">Welcome to Otter Web!</div>
      <div id="subtitleText" class="otter-text" style="color: #94a3b8;">Write clean, human-readable code that compiles straight to HTML5.</div>
      <input type="text" id="inputBox" class="otter-text-box" value="" placeholder="Type something here..." style="width: 340px; background-color: #1e293b; color: white;" />
      <button id="actionButton" class="otter-button" style="width: 120px; background-color: #6366f1; color: white;">Click Me!</button>
      <div id="outputMessage" class="otter-text" style="color: #a7f3d0;">Waiting for input...</div>
</div>
    </main>
  <div id="otter-live-output"></div>

  <script>
    // Otter Runtime helpers for the browser
    const empty = "";
    const gone = null;
    function otterGetElement(id) { return document.getElementById(id); }
    function otterGetText(id) {
      const el = otterGetElement(id);
      if (!el) return '';
      if ('value' in el) return el.value;
      return el.textContent || '';
    }
    function otterSetText(id, val) {
      const el = otterGetElement(id);
      if (!el) return;
      if ('value' in el) { el.value = val; }
      else { el.textContent = val; }
    }
    function otterGetTitle(id) { return document.title; }
    function otterSetTitle(id, val) { document.title = val; }
    function otterSetStyle(id, prop, val) {
      const el = otterGetElement(id);
      if (el) el.style[prop] = val;
    }
    function otterGetStyle(id, prop) {
      const el = otterGetElement(id);
      return el ? el.style[prop] : '';
    }
    function otterSetProperty(id, prop, val) {
      const el = otterGetElement(id);
      if (el) el[prop] = val;
    }
    function otterGetProperty(id, prop) {
      const el = otterGetElement(id);
      return el ? el[prop] : '';
    }
    function otterSay(...args) {
      console.log(...args);
      const out = document.getElementById('otter-live-output');
      if (out) {
        out.style.display = 'block';
        out.textContent = args.join(' ');
      }
    }

    // Top-level application initialization
    (async function() {


    // Register event listeners
    const el_actionButton = document.getElementById('actionButton');
    if (el_actionButton) {
      el_actionButton.addEventListener('click', async (event) => {
      let entered = otterGetText('inputBox'); window.entered = entered;
      if ((entered === "")) {
        otterSetText('outputMessage', "You clicked the button with empty input!");
      }
      else {
        otterSetText('outputMessage', entered);
      }
      });
    }
    })();
  </script>
</body>
</html>
