<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="otterBrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b07d56"/>
      <stop offset="100%" stop-color="#8c5835"/>
    </linearGradient>
    <linearGradient id="otterMuzzle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Left Ear -->
  <circle cx="24" cy="28" r="13" fill="#8c5835"/>
  <circle cx="24" cy="28" r="8" fill="#fde68a"/>

  <!-- Right Ear -->
  <circle cx="76" cy="28" r="13" fill="#8c5835"/>
  <circle cx="76" cy="28" r="8" fill="#fde68a"/>

  <!-- Head Shape -->
  <path d="M 20,48 C 18,22 82,22 80,48 C 82,78 68,88 50,88 C 32,88 18,78 20,48 Z" fill="url(#otterBrown)"/>

  <!-- Muzzle / Cheeks -->
  <ellipse cx="50" cy="62" rx="22" ry="16" fill="url(#otterMuzzle)"/>

  <!-- Left Eye -->
  <circle cx="37" cy="46" r="5" fill="#1e1b18"/>
  <circle cx="35.5" cy="44.5" r="2" fill="#ffffff"/>

  <!-- Right Eye -->
  <circle cx="63" cy="46" r="5" fill="#1e1b18"/>
  <circle cx="61.5" cy="44.5" r="2" fill="#ffffff"/>

  <!-- Cute Nose -->
  <path d="M 46,55 Q 50,53 54,55 Q 50,60 46,55 Z" fill="#2d1d14"/>

  <!-- Mouth -->
  <path d="M 46,60 Q 50,64 54,60" fill="none" stroke="#2d1d14" stroke-width="2" stroke-linecap="round"/>

  <!-- Whisker Dots -->
  <circle cx="41" cy="61" r="1" fill="#78350f"/>
  <circle cx="38" cy="64" r="1" fill="#78350f"/>
  <circle cx="59" cy="61" r="1" fill="#78350f"/>
  <circle cx="62" cy="64" r="1" fill="#78350f"/>
</svg>
