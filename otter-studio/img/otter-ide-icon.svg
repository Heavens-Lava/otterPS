<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Otter Studio application icon</title>
  <desc id="desc">A warm otter face on a deep navy rounded square with cobalt code marks.</desc>
  <defs>
    <linearGradient id="tile" x1="72" y1="56" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142D55"/>
      <stop offset=".52" stop-color="#091A35"/>
      <stop offset="1" stop-color="#061126"/>
    </linearGradient>
    <linearGradient id="fur" x1="256" y1="120" x2="256" y2="405" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CA936B"/>
      <stop offset=".54" stop-color="#A76543"/>
      <stop offset="1" stop-color="#703C2A"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="256" y1="257" x2="256" y2="387" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF2D8"/>
      <stop offset="1" stop-color="#E7B987"/>
    </linearGradient>
    <linearGradient id="ear" x1="256" y1="122" x2="256" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4C08E"/>
      <stop offset="1" stop-color="#A45D40"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="17" stdDeviation="14" flood-color="#020814" flood-opacity=".65"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- The 48px inset preserves a clean silhouette on macOS, Windows, and browser tabs. -->
  <rect x="48" y="48" width="416" height="416" rx="104" fill="url(#tile)"/>
  <rect x="50" y="50" width="412" height="412" rx="102" fill="none" stroke="#5A9CFF" stroke-opacity=".24" stroke-width="4"/>
  <circle cx="256" cy="263" r="159" fill="#1677FF" fill-opacity=".13" filter="url(#glow)"/>

  <!-- Abstract editor brackets: an IDE cue without turning the mark into text. -->
  <path d="M159 197 120 256l39 59" fill="none" stroke="#4D9AFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
  <path d="m353 197 39 59-39 59" fill="none" stroke="#4D9AFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
  <path d="M224 359 288 153" fill="none" stroke="#6FB0FF" stroke-width="12" stroke-linecap="round" opacity=".5"/>

  <g filter="url(#shadow)">
    <!-- Ears sit behind the head for a strong small-size silhouette. -->
    <circle cx="178" cy="191" r="59" fill="#7B442F"/>
    <circle cx="334" cy="191" r="59" fill="#7B442F"/>
    <circle cx="178" cy="191" r="37" fill="url(#ear)"/>
    <circle cx="334" cy="191" r="37" fill="url(#ear)"/>

    <path d="M151 250c0-86 46-128 105-128s105 42 105 128c0 103-43 157-105 157S151 353 151 250Z" fill="url(#fur)"/>
    <path d="M170 251c9-74 45-105 86-105s77 31 86 105" fill="none" stroke="#F3C095" stroke-opacity=".32" stroke-width="10" stroke-linecap="round"/>

    <!-- Eye masks, eyes, and highlights remain distinct after downscaling. -->
    <ellipse cx="205" cy="250" rx="37" ry="31" fill="#42241D" fill-opacity=".34"/>
    <ellipse cx="307" cy="250" rx="37" ry="31" fill="#42241D" fill-opacity=".34"/>
    <circle cx="207" cy="250" r="18" fill="#121827"/>
    <circle cx="305" cy="250" r="18" fill="#121827"/>
    <circle cx="201" cy="243" r="6" fill="#FFFDF7"/>
    <circle cx="299" cy="243" r="6" fill="#FFFDF7"/>
    <circle cx="214" cy="258" r="3" fill="#8FBFFF" fill-opacity=".8"/>
    <circle cx="312" cy="258" r="3" fill="#8FBFFF" fill-opacity=".8"/>

    <path d="M182 310c0-37 33-63 74-63s74 26 74 63c0 57-29 83-74 83s-74-26-74-83Z" fill="url(#muzzle)"/>
    <path d="M234 292q22-17 44 0-4 23-22 23t-22-23Z" fill="#2A1A1D"/>
    <path d="M256 314v13m0 0c-12 16-27 11-32 3m32-3c12 16 27 11 32 3" fill="none" stroke="#51302A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M208 327h-25m23 13h-29m123-13h25m-23 13h29" stroke="#815040" stroke-width="5" stroke-linecap="round" opacity=".85"/>
    <ellipse cx="221" cy="335" rx="4" ry="3" fill="#9A5E4B"/>
    <ellipse cx="291" cy="335" rx="4" ry="3" fill="#9A5E4B"/>
  </g>

  <!-- Coral status point gives the otherwise quiet palette a memorable accent. -->
  <circle cx="383" cy="382" r="13" fill="#FF806C"/>
  <circle cx="383" cy="382" r="5" fill="#FFE1D7"/>
</svg>
