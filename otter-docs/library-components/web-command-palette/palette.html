<div class="pal-stage">
  <div class="pal-card" role="search">
    <input id="palInput" class="pal-input" type="search" placeholder="Type a command (e.g. pack, workflow, verify)..." aria-label="Filter commands" autocomplete="off">
    <ul id="palList" class="pal-list" role="listbox" aria-label="Available commands"></ul>
    <div id="palStatus" class="pal-status" aria-live="polite">Use ↑/↓ arrows and Enter to run a command.</div>
  </div>
</div>
