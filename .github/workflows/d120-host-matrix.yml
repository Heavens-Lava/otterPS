name: D120 host smoke matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The release archive is built on Windows PowerShell 5.1, exactly as a
  # release is; macOS and Linux runners then unzip and install that same file.
  release-archive-build:
    name: Release archive built on Windows PowerShell 5.1
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:GITHUB_WORKSPACE 'tools/New-OtterDistribution.ps1') -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'release-archive') -Force
          if ($LASTEXITCODE -ne 0) { throw "Release archive build failed (exit $LASTEXITCODE)" }
      - uses: actions/upload-artifact@v4
        with:
          name: otter-release-archive
          path: release-archive/*.zip
          if-no-files-found: error

  release-archive-install:
    name: Release archive on ${{ matrix.name }}
    needs: release-archive-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: otter-release-archive
          path: release-archive
      - name: Unzip, install, run and uninstall the Windows-built archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = @(Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'release-archive') -Filter '*.zip')[0].FullName
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'tools/Test-OtterDistribution.ps1') -Archive $zip
          if ($LASTEXITCODE -ne 0) { throw "The Windows-built archive failed on ${{ matrix.name }} (exit $LASTEXITCODE)" }

  production-cli-smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            runner: windows-2025
            host: powershell.exe
          - name: PowerShell 7 on Windows
            runner: windows-2025
            host: pwsh
          - name: PowerShell 7 on Linux
            runner: ubuntu-24.04
            host: pwsh
          - name: PowerShell 7 on macOS
            runner: macos-15
            host: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Record host and verify production CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = '${{ matrix.host }}'
          Write-Output "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Output "Architecture: $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          $hostVersion = & $engine -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw "Could not start $engine" }
          Write-Output "Test host PowerShell: $hostVersion"
          Write-Output "Commit: $env:GITHUB_SHA"

          $version = (Get-Content VERSION -Raw).Trim()
          $output = & $engine -NoProfile -File ./otter.ps1 --version 2>&1
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch [regex]::Escape("Otter $version")) {
            throw "otter --version failed (exit $LASTEXITCODE): $($output -join ' | ')"
          }

          $output = & $engine -NoProfile -File ./otter.ps1 run ./conformance/release/hello.ot 2>&1
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch 'Hello from Otter') {
            throw "otter run failed (exit $LASTEXITCODE): $($output -join ' | ')"
          }

          $output = & $engine -NoProfile -File ./otter.ps1 check ./conformance/release/hello.ot 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "otter check failed (exit $LASTEXITCODE): $($output -join ' | ')"
          }
          Write-Output 'D120 production CLI smoke passed: --version, run, check.'
      - name: Verify project CLI workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = '${{ matrix.host }}'
          $otter = Join-Path $env:GITHUB_WORKSPACE 'otter.ps1'
          $work = Join-Path $env:RUNNER_TEMP ('otter-d120-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $work | Out-Null
          $project = Join-Path $work 'D120Smoke'
          $checks = @(
            @{ name = 'new'; argv = @('new', 'console', 'D120Smoke') }
            @{ name = 'check'; argv = @('check', $project) }
            @{ name = 'test'; argv = @('test', $project) }
            @{ name = 'run'; argv = @('run', (Join-Path $project 'main.ot')) }
            @{ name = 'build'; argv = @('build', $project) }
            @{ name = 'publish'; argv = @('publish', $project) }
          )
          $failures = @()
          Push-Location $work
          try {
            foreach ($check in $checks) {
              $argv = [string[]]$check.argv
              try {
                $output = & $engine -NoProfile -File $otter @argv 2>&1
                $code = $LASTEXITCODE
              } catch {
                $output = @($_.Exception.Message)
                $code = 99
              }
              Write-Output "$($check.name): exit $code"
              if ($code -ne 0) {
                $failures += "$($check.name): $($output -join ' | ')"
              }
            }
          } finally {
            Pop-Location
          }
          if ($failures.Count -gt 0) {
            throw "D120 project workflow failed: $($failures -join '; ')"
          }
          Write-Output 'D120 project workflow passed: new, check, test, run, build, publish.'
      - name: Verify distribution build, install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = '${{ matrix.host }}'
          # Builds the release payload, installs it with Install-Otter.ps1 using
          # this host, runs programs through the installed launcher (otter.cmd on
          # Windows, otter on macOS and Linux), and on macOS/Linux also checks the
          # ~/.local/bin command and the uninstaller.
          & $engine -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'tools/Test-OtterDistribution.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Distribution smoke failed on $engine (exit $LASTEXITCODE)" }
      - name: Verify portable language and module suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = '${{ matrix.host }}'
          # These suites cover the language and console/project surface that
          # Otter advertises across PS 5.1 and pwsh. Windows-only integration
          # suites (WPF, registry, DPAPI, printers, etc.) remain separately
          # classified as target-specific in the release scope matrix.
          $suiteNames = @(
            'HostPortability.Tests.ps1',
            'EventContract.Tests.ps1',
            'Http.Tests.ps1',
            'Lexer.Tests.ps1',
            'Parser.Tests.ps1',
            'Grammar.Tests.ps1',
            'Collections.Tests.ps1',
            'Objects.Tests.ps1',
            'Data.Tests.ps1',
            'Dates.Tests.ps1',
            'Bytes.Tests.ps1',
            'Csv.Tests.ps1',
            'Xml.Tests.ps1',
            'Interpreter.Tests.ps1',
            'Conformance.Tests.ps1',
            'Module.Tests.ps1',
            'UseModuleProduction.Tests.ps1',
            'Project.Tests.ps1',
            'ProjectBuild.Tests.ps1',
            'ProjectCreationAndTestRunner.Tests.ps1',
            'ProjectPublish.Tests.ps1',
            'Web.Tests.ps1',
            'WebRuntimeUi.Tests.ps1',
            'PlatformBoundaries.Tests.ps1'
          )
          $failures = @()
          foreach ($suiteName in $suiteNames) {
            $suitePath = Join-Path $env:GITHUB_WORKSPACE (Join-Path 'tests' $suiteName)
            $output = & $engine -NoProfile -File $suitePath 2>&1
            $code = $LASTEXITCODE
            Write-Output "${suiteName}: exit $code"
            if ($code -ne 0) {
              $failures += "${suiteName}: $($output -join ' | ')"
            }
          }
          if ($failures.Count -gt 0) {
            throw "D120 portable suite failed: $($failures -join '; ')"
          }
          Write-Output "D120 portable language suite passed ($($suiteNames.Count) suites)."
